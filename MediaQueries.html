<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media Query Example</title>
<style>
/* Default style - Desktop */
body {
  background-color: rgb(222, 222, 119);
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px;
}

/* Tablet breakpoint */
@media (max-width: 768px) {
  body {
    background-color: rgb(71, 241, 71);
  }
}

/* Mobile breakpoint */
@media (max-width: 480px) {
  body {
    background-color: rgb(138, 224, 253);
  }
}
</style>
</head>
<body>
  <h1>Responsive Design</h1>
  <p>Resize the browser window to see the background color change.</p>
</body>
</html>
