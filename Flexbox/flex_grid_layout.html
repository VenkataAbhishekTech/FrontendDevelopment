<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Flexbox & Grid Layout</title>
  <link rel="stylesheet" href="flex_grid_layout.css">
</head>
<body>
  <header>
    <div class="logo">MyLogo</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <article>
      <h1 class="fade-title">Welcome to My Website</h1>
      <div class="content-boxes">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
      </div>
    </article>

    <aside>
      <h2>Sidebar</h2>
      <p>This section contains links, ads, or extra information.</p>
    </aside>
  </main>

  <footer>
    <p>© 2025 MyWebsite. All Rights Reserved.</p>
  </footer>
</body>
</html>
