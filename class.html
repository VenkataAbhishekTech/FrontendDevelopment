<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Abhishek - Simple Page</title>
</head>
<body>
    <h1>My First Page</h1>

    <!-- Name with inline color (easy for beginners) -->
    <h2 style="color: blue;">Abhishek</h2>

    <p>Hello, I am linking HTML.</p>

    <!-- Simple image with a fallback if the image cannot load -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Monkey_portrait.jpg"
             alt="Monkey portrait"
             width="300"
             onerror="this.src='https://via.placeholder.com/300x400?text=No+Image';">

    <h3>My favorite movies</h3>
    <ul>
        <li>The Shawshank Redemption</li>
        <li>Inception</li>
        <li>The Dark Knight</li>
    </ul>

    <p>To change the name color, edit the <code>style="color: ..."</code> value.</p>
</body>
</html>
