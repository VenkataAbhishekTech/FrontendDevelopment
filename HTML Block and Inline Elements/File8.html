<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report Page</title>
</head>
<body>

  <!-- SCHOOL NAME -->
  <h1 title="ABC High School">ABC High School - Student Report</h1>

  <!-- STUDENT INFO TABLE -->
  <table border="1" cellpadding="8" cellspacing="0">

    <!-- Table Header -->
    <thead>
      <tr>
        <th rowspan="2">Subject</th>
        <th colspan="2">Marks</th>
      </tr>
      <tr>
        <th>Maximum</th>
        <th>Obtained</th>
      </tr>
    </thead>

    <!-- Table Body -->
    <tbody>
      <tr>
        <td title="Subject: English">English</td>
        <td>100</td>
        <td>88</td>
      </tr>
      <tr>
        <td title="Subject: Mathematics">Mathematics</td>
        <td>100</td>
        <td>92</td>
      </tr>
      <tr>
        <td title="Subject: Science">Science</td>
        <td>100</td>
        <td>85</td>
      </tr>
      <tr>
        <td title="Subject: Social Studies">Social Studies</td>
        <td>100</td>
        <td>80</td>
      </tr>
      <tr>
        <td title="Subject: Computer Science">Computer Science</td>
        <td>100</td>
        <td>95</td>
      </tr>
    </tbody>

    <!-- Table Footer -->
    <tfoot>
      <tr>
        <td colspan="2" title="Total Marks Scored">Total Marks</td>
        <td>440 / 500</td>
      </tr>
      <tr>
        <td colspan="2" title="Overall Percentage">Percentage</td>
        <td>88%</td>
      </tr>
    </tfoot>
  </table>

  <!-- FOOTNOTE -->
  <p><strong>Note:</strong> This is a sample report card. Marks are for demonstration only.</p>

</body>
</html>
