<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Database</title>
</head>
<body>
    <h1>My Movie Database</h1>

    <table border="1" title="Movie Information Table" cellspacing="0" cellpadding="5">
        <!-- Table Caption -->
        <caption><strong>Top Movies Collection</strong></caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Movie Name</th>
                <th>Genre</th>
                <th>Year</th>
                <th>IMDB Rating</th>
                <th>Link</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Inception</td>
                <td>Science Fiction</td>
                <td>2010</td>
                <td>8.8</td>
                <td><a href="https://www.imdb.com/title/tt1375666/" target="_blank">IMDB</a></td>
            </tr>
            <tr>
                <td>The Godfather</td>
                <td>Crime/Drama</td>
                <td>1972</td>
                <td>9.2</td>
                <td><a href="https://www.imdb.com/title/tt0068646/" target="_blank">IMDB</a></td>
            </tr>
            <tr>
                <td>The Dark Knight</td>
                <td>Action/Drama</td>
                <td>2008</td>
                <td>9.0</td>
                <td><a href="https://www.imdb.com/title/tt0468569/" target="_blank">IMDB</a></td>
            </tr>
            <tr>
                <td colspan="3"><strong>Average Rating</strong></td>
                <td colspan="2">8.97</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="5"><small>Note: Ratings are based on IMDB scores as of 2025.</small></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
