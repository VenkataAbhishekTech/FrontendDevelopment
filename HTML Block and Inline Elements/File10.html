<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>
<body>
    <h1>Dropdown-based Selection</h1>

    <label for="country">Country:</label>
    <select id="country" onchange="updateSummary()">
        <option value="India" selected>India</option>
        <option value="USA">USA</option>
        <option value="France">France</option>
    </select>
    <br><br>

    <label for="state">State:</label>
    <select id="state" onchange="updateSummary()">
        <option value="Karnataka" selected>Karnataka</option>
        <option value="California">California</option>
        <option value="Ile-de-France">Ile-de-France</option>
    </select>
    <br><br>

    <label for="city">City:</label>
    <select id="city" onchange="updateSummary()">
        <option value="Bangalore" selected>Bangalore</option>
        <option value="Los Angeles">Los Angeles</option>
        <option value="Paris">Paris</option>
    </select>
    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" onchange="updateSummary()">
        <option value="Mysore Palace" selected>Mysore Palace</option>
        <option value="Disneyland">Disneyland</option>
        <option value="Eiffel Tower">Eiffel Tower</option>
    </select>
    <br><br>

    <p id="summary">
        You have selected: India, Karnataka, Bangalore. Favorite Tourist Place: Mysore Palace.
    </p>

    <script>
        function updateSummary() {
            const country = document.getElementById('country').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const place = document.getElementById('place').value;

            document.getElementById('summary').textContent =
                `You have selected: ${country}, ${state}, ${city}. Favorite Tourist Place: ${place}.`;
        }
    </script>
</body>
</html>
