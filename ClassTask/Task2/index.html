<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 2: BMI Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h2>BMI Calculator</h2>

            <label for="weight">Weight (kg)</label>
            <input type = "number" id="weight" step="0.1" placeholder="Enter weight in kg:">

            <label for = "height">Height (m)</label>
            <input type="number" id="height" step="0.01" placeholder = "Enter height in meters:">

            <button id="calculator" type="button">Calculate BMI</button>
            <h3 id="result"></h3>

            <div class = "progress">
                <div id="progressBar"></div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
