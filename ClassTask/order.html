<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Order Processing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="order.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h3 class="text-center mb-0">Order Processing System</h3>
                    </div>
                    <div class="card-body">
                        <form id="orderForm">
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Product Price (₹)</label>
                                <input type="text" class="form-control" id="productPrice" placeholder="Enter product price" required>
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Quantity</label>
                                <input type="text" class="form-control" id="quantity" placeholder="Enter quantity" required>
                            </div>
                            <div class="mb-3">
                                <label for="deliveryDay" class="form-label">Delivery Day (1-7)</label>
                                <select class="form-select" id="deliveryDay" required>
                                    <option value="">Select delivery day</option>
                                    <option value="1">1 - Monday</option>
                                    <option value="2">2 - Tuesday</option>
                                    <option value="3">3 - Wednesday</option>
                                    <option value="4">4 - Thursday</option>
                                    <option value="5">5 - Friday</option>
                                    <option value="6">6 - Saturday</option>
                                    <option value="7">7 - Sunday</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Process Order</button>
                        </form>
                        <div id="result" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="order.js"></script>
</body>
</html>
