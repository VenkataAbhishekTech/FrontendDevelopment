<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern UI Card</title>
  <style>
    /* Reset default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Background gradient */
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #6798ed);
    }

    /* Card styling */
    .card {
      background: #fdfdfd;
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 400px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover effect (optional for modern feel) */
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    /* Heading style */
    .card h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #333;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
    }

    /* Paragraph style */
    .card p {
      color: #555;
      font-size: 1em;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Modern UI Card</h2>
    <p>
      This card uses <b>box-shadow</b> for depth and <b>text-shadow</b> 
      for soft text highlight. These effects make the design look clean and modern.
    </p>
  </div>
</body>
</html>
