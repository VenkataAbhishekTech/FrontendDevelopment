<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 2 - Card and Body Transition</title>
<style>
/* Base styles */
body {
  background-color: #dee75d;
  font-family: Arial, sans-serif;
  transition: background-color 1s ease; /* smooth body transition */
}

/* Card styling */
.card {
  width: 250px;
  height: 160px;
  background-color: #2a71c3; /* normal card color */
  color: rgb(73, 228, 67);
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 12px;
  margin: 100px auto;
  font-size: 20px;
  cursor: pointer;
  transition: background-color 1s ease, transform 1s ease;
}

/* Hover effect */
.card:hover {
  background-color: #e8a010; /* lighter card color */
  transform: scale(1.1);
}

/* Change body color when hovering card */
.card:hover + body,
body:hover .card {
  background-color: #0c0c0c;
}
</style>
</head>
<body>

  <div class="card" onmouseover="changeBg(true)" onmouseout="changeBg(false)">
    Hover over me!
  </div>

<script>
function changeBg(isHovering) {
  document.body.style.backgroundColor = isHovering ? "#d6eaf8" : "#f4f4f4";
}
</script>

</body>
</html>
