<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Food Delivery System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #716f6f;
      margin-bottom: 20px;
    }

    #output {
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Food Delivery Smart Order System</h1>

  <button id="startOrderBtn">Start Order</button>

  <div id="output"></div>

  <script>
    const startOrderBtn = document.getElementById("startOrderBtn");
    const outputDiv = document.getElementById("output");

    // Utility function to log messages
    function log(msg) {
        const p = document.createElement("p");
        p.textContent = msg;
        outputDiv.appendChild(p);
    }

    // System A: Restaurant Confirmation
    function restaurantConfirmation() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                const success = Math.random() > 0.3; // 70% success chance
                if (success) resolve("Restaurant accepted");
                else reject("Restaurant rejected");
            }, 2000);
        });
    }

    // System B: Delivery Partner Location
    function riderLocation() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                const success = Math.random() > 0.3; // 70% success chance
                if (success) resolve("Rider found");
                else reject("No rider available");
            }, 1000);
        });
    }

    // System C: Order Status Update from fake API
    async function fetchOrderStatus() {
        try {
            const response = await fetch("https://fakestoreapi.com/products/1");
            if (!response.ok) throw new Error("API fetch failed");
            const data = await response.json();
            return `Order Item: ${data.title} | Price: $${data.price}`;
        } catch (error) {
            throw new Error("Failed to fetch order status");
        }
    }

    // Run combined pipeline
    async function processOrder() {
        outputDiv.innerHTML = ""; // Clear previous output
        log("Starting order process...");

        try {
            // Step 1: Restaurant Confirmation
            const restaurant = await restaurantConfirmation();
            log(`Step 1: ${restaurant}`);

            // Step 2: Rider Location
            const rider = await riderLocation();
            log(`Step 2: ${rider}`);

            // Step 3: Order Status from API
            const orderStatus = await fetchOrderStatus();
            log(`Step 3: ${orderStatus}`);

            log("✅ Order process completed successfully!");
        } catch (error) {
            log(`❌ Order process failed: ${error}`);
        }
    }

    // Event listener
    startOrderBtn.addEventListener("click", processOrder);
  </script>
</body>
</html>
