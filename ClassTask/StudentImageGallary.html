<!DOCTYPE html>
<html>
<body style="font-family:Arial; text-align:center; background:#f2f2f2;">

<h2>Student Image Gallery</h2>

<!-- Gallery -->
<div style="display:flex; flex-wrap:wrap; justify-content:center; gap:20px;">

    <div onclick="openModal('Amit Sharma','https://randomuser.me/api/portraits/men/11.jpg')" style="cursor:pointer;">
        <img src="https://randomuser.me/api/portraits/men/11.jpg" width="150" style="border-radius:10px;">
        <p>Amit Sharma</p>
    </div>

    <div onclick="openModal('Riya Patel','https://randomuser.me/api/portraits/women/22.jpg')" style="cursor:pointer;">
        <img src="https://randomuser.me/api/portraits/women/22.jpg" width="150" style="border-radius:10px;">
        <p>Riya Patel</p>
    </div>

    <div onclick="openModal('Sahil Khan','https://randomuser.me/api/portraits/men/33.jpg')" style="cursor:pointer;">
        <img src="https://randomuser.me/api/portraits/men/33.jpg" width="150" style="border-radius:10px;">
        <p>Sahil Khan</p>
    </div>

    <div onclick="openModal('Pooja Singh','https://randomuser.me/api/portraits/women/44.jpg')" style="cursor:pointer;">
        <img src="https://randomuser.me/api/portraits/women/44.jpg" width="150" style="border-radius:10px;">
        <p>Pooja Singh</p>
    </div>

</div>

<!-- Modal -->
<div id="modal" 
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7); justify-content:center; align-items:center;"
     onclick="closeModal(event)">

    <div style="background:white; padding:20px; border-radius:10px; text-align:center;">
        <img id="modal-img" src="" width="200" style="border-radius:10px;">
        <h3 id="modal-name"></h3>
    </div>

</div>

<script>
function openModal(name, img) {
    document.getElementById("modal-name").innerHTML = name;
    document.getElementById("modal-img").src = img;
    document.getElementById("modal").style.display = "flex";
}

function closeModal(e) {
    if (e.target.id === "modal") {
        document.getElementById("modal").style.display = "none";
    }
}
</script>

</body>
</html>
