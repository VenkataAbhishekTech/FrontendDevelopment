<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Height and Width Practice Layout</h1>

  <div class="container">
    <div class="box box1">
      <h3>Box 1 (px + min-height)</h3>
      <p>Width: 200px<br>Min-Height: 150px</p>
    </div>

    <div class="box box2">
      <h3>Box 2 (% + vh)</h3>
      <p>Width: 25%<br>Height: 30vh</p>
    </div>

    <div class="box box3">
      <h3>Box 3 (em + max-width)</h3>
      <p>Width: 25em (max 300px)<br>Height: 200px<br>Overflow enabled</p>
      <p>This text is here to show how overflow works if content exceeds the defined height.</p>
    </div>
  </div>
</body>
</html>
