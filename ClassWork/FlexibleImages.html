<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexible Images</title>
<style>
  /* Page Styling */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #050505;
    padding: 50px;
  }

  h1 {
    margin-bottom: 20px;
    color: #eed973; 
  }

  p {
    color: #aafa49; 
    font-size: 18px;
    margin-bottom: 30px;
  }

  /* Image Styling */
  img {
    max-width: 100%;  
    height: auto;      
    border-radius: 15px; 
    box-shadow: 0 4px 8px rgba(102, 241, 176, 0.2); 
  }

  /* Optional: Container to limit max image size */
  .image-container {
    max-width: 600px;
    margin: auto;
  }
</style>
</head>
<body>
  <h1>Flexible Image Example</h1>
  <p>The image below resizes smoothly across all devices.</p>

  <div class="image-container">
    <img src="https://picsum.photos/800/400" alt="Responsive Example Image">
  </div>
</body>
</html>
