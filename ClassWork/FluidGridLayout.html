<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluid Grid Layout</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #090909;
  }

  /* Container with Flexbox */
  .container {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    width: 90%;
    max-width: 1000px;
    gap: 20px;
  }

  /* Individual Boxes */
  .box {
    flex: 1 1 30%; /* Grow/Shrink and occupy roughly 1/3 width */
    background-color: #96ef69;
    color: rgb(13, 14, 13);
    text-align: center;
    padding: 50px 0;
    border-radius: 10px;
    transition: background-color 0.3s ease;
  }

  .box:hover {
    background-color: #357abd;
  }

  /* Responsive Behavior */
  @media (max-width: 768px) {
    .box {
      flex: 1 1 45%;
    }
  }

  @media (max-width: 480px) {
    .box {
      flex: 1 1 100%;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>
</body>
</html>
