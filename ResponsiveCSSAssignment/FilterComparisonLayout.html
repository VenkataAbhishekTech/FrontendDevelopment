<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="FilterComparisonLayout.css">
</head>
<body>
    <section class="comparison-section">
        <h1>Before and After Filter Comparison</h1>
        <div class="image-container">
            <figure class="image-box">
                <img src="https://picsum.photos/id/1015/600/400" alt="Before Image">
                <figcaption>Before Filter</figcaption>
            </figure>

            <figure class="image-box filtered">
                <img src="https://picsum.photos/id/1015/600/400" alt="After Filter">
                <figcaption>After Filter (Brightness Applied)</figcaption>
            </figure>
        </div>
    </section>
</body>
</html>
