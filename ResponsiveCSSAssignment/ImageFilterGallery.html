<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="ImageFilterGallery.css">
</head>
<body>
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over an image to remove the filter effect.</p>
    </header>

    <section class="gallery">
        <figure>
            <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
            <figcaption>Blur Effect</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
            <figcaption>Grayscale Effect</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1035/600/400" alt="Bridge">
            <figcaption>Sepia Effect</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1041/600/400" alt="Forest">
            <figcaption>Brightness Effect</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1062/600/400" alt="Sea">
            <figcaption>Contrast Effect</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/1059/600/400" alt="Desert">
            <figcaption>Hue Rotate Effect</figcaption>
        </figure>
    </section>
</body>
</html>
