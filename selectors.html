<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors Demo</title>
  <link rel="stylesheet" href="selectors.css">
</head>
<body>
  <h1>Advanced CSS Selectors</h1>

  <section class="form-section">
    <h2>Attribute Selector Example</h2>
    <form>
      <input type="text" placeholder="Enter your name">
      <input type="email" placeholder="Enter your email">
      <input type="password" placeholder="Enter password">
      <button type="submit">Submit</button>
    </form>
  </section>

  <section class="links-section">
    <h2>Links with Attribute Selectors</h2>
    <ul>
      <li><a href="https://openai.com">OpenAI Website</a></li>
      <li><a href="http://example.com">Example Site</a></li>
      <li><a href="https://github.com">GitHub</a></li>
    </ul>
  </section>

  <section class="list-section">
    <h2>Pseudo-classes and Combinators</h2>
    <ul class="items">
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
      <li>Fourth item</li>
    </ul>
  </section>

  <p class="note">This paragraph appears after the list.</p>
</body>
</html>
