<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header>
    <h1>My Dashboard</h1>
    <nav>
      <a href="#" style="color: white; margin-right: 15px;">Profile</a>
      <a href="#" style="color: white;">Logout</a>
    </nav>
  </header>

  <div class="dashboard">
    <aside class="sidebar">
      <h2>Menu</h2>
      <a href="#">Overview</a>
      <a href="#">Analytics</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </aside>

    <main class="main-content">
      <div class="content-box">
        <h3>Overview</h3>
        <p>Quick summary of your dashboard insights.</p>
      </div>
      <div class="content-box">
        <h3>Recent Activity</h3>
        <p>Latest updates and system logs appear here.</p>
      </div>
      <div class="content-box">
        <h3>Analytics</h3>
        <p>Track user performance and growth trends.</p>
      </div>
      <div class="content-box">
        <h3>Settings</h3>
        <p>Manage your account preferences and security.</p>
      </div>
    </main>
  </div>
</body>
</html>
