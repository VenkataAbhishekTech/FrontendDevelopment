<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-JQuery Widgets Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Dashboard Widgets</h2>

<div class="carousel">
  <div class="slide active">Slide 1</div>
  <div class="slide">Slide 2</div>
  <div class="slide">Slide 3</div>
</div>

<div class="widgets">
  <div class="widget" data-tooltip="Widget 1 Info">Widget 1</div>
  <div class="widget" data-tooltip="Widget 2 Info">Widget 2</div>
  <div class="widget" data-tooltip="Widget 3 Info">Widget 3</div>
</div>

<button id="show-modal">Show Notification</button>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <p>New Notification Received!</p>
  </div>
</div>

<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script>
  var jQv1 = jQuery.noConflict(true);
</script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  var jQv2 = jQuery.noConflict(true);
</script>

<script src="script.js" defer></script>
</body>
</html>
