<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <h2>Task Manager</h2>

  <select id="filter">

  <ul id="taskList"></ul>

  <script src="script.js"></script>
</body>
</html>
