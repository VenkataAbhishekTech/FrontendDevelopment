<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Courses</title>
  <link rel="stylesheet" href="style.css">

  <li class="course">React Fundamentals</li>

  <li class="course">UI/UX Design Principles</li>
  <li class="course">Django Web Development</li>
  <li class="course">SQL & Databases</li>
  <li class="course">Angular Essentials</li>
</ul>

</body>
</html>
