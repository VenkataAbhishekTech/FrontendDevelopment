<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="task-tracker.css">
</head>

<body class="bg-light">

  <header class="bg-primary text-white text-center py-4">
    <h1 class="fw-bold">Task Tracker</h1>
    <p class="fs-5 mb-0">
      Pending Tasks 
      <span class="badge bg-warning text-dark ms-2">5</span>
    </p>
  </header>

  <main class="container my-5">
    <div class="card shadow-lg p-4 rounded-4">
      <h2 class="text-center text-primary fw-bold mb-4">My To-Do List</h2>

      <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Complete project report
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Schedule team meeting
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Update website content
          <span class="badge bg-success">Low</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Respond to client emails
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Review budget sheet
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
      </ul>

      <div class="text-center">
        <button class="btn btn-success btn-lg px-4">
          Completed <span class="badge bg-light text-success ms-2">2</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 Task Tracker | Built with Bootstrap 5</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
