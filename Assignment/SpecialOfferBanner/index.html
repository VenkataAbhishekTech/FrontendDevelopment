<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Offer Banner</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

<h2>Special Offer Banners</h2>

<div class="banner-container">
  <div class="banner">50% Off on Headphones!</div>
  <div class="banner">Buy 1 Get 1 Free – Smart Watches!</div>
  <div class="banner">20% Discount on Gaming Accessories</div>
  <div class="banner">Free Shipping on Orders Above $50</div>
  <div class="banner">New Arrivals: Bluetooth Speakers</div>
</div>

<div class="buttons">
  <button id="hide">Hide Banners</button>
  <button id="show">Show Banners</button>
  <button id="slide">Slide Up/Down</button>
  <button id="fade">Fade In/Out</button>
</div>

</body>
</html>
