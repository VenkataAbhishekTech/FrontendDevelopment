<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect</title>
  <link rel="stylesheet" href="shadows.css">
</head>
<body>
  <div class="container">
    <div class="card card1">
      <h2>Profile One</h2>
      <p>This is a simple card with soft shadows and subtle depth.</p>
    </div>
    <div class="card card2">
      <h2>Profile Two</h2>
      <p>This card has a stronger shadow giving a floating effect.</p>
    </div>
    <div class="card card3">
      <h2>Profile Three</h2>
      <p>This one uses a spread shadow for more boldness and depth.</p>
    </div>
  </div>
</body>
</html>
