<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grocery Bill Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Grocery Bill Calculator</h2>

    <label for="price">Price (₹):</label>
    <input type="number" id="price" min="0" step="0.01" placeholder="Enter price">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="0" step="1" placeholder="Enter quantity">

    <button id="calcBtn" type="button">Calculate</button>

    <h3 id="output" aria-live="polite"></h3>
    <p id="error" class="error" role="status" aria-live="assertive"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
