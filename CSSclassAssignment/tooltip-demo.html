<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Tooltip Demonstration (CSS Only)</h1>

  <div class="tooltip-container">
    <div class="tooltip">HTML
      <span class="tooltip-text">HyperText Markup Language</span>
    </div>

    <div class="tooltip">CSS
      <span class="tooltip-text">Cascading Style Sheets</span>
    </div>

    <div class="tooltip">💡
      <span class="tooltip-text">This is a light bulb icon tooltip!</span>
    </div>

    <div class="tooltip">🔍
      <span class="tooltip-text">Search Icon Tooltip</span>
    </div>
  </div>

  <footer>
    <p>Hover over the elements above to see tooltips in action!</p>
  </footer>
</body>
</html>
