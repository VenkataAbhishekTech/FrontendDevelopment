<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="image-showcase.css">
</head>
<body>

  <h1>Image Showcase Layout</h1>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/id/1015/400/300" alt="Nature 1">
      <figcaption>Mountain View</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1025/400/300" alt="Nature 2">
      <figcaption>Golden Retriever</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1035/400/300" alt="Nature 3">
      <figcaption>Forest Path</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1045/400/300" alt="Nature 4">
      <figcaption>Sunset Beach</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1055/400/300" alt="Nature 5">
      <figcaption>Snowy Mountains</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/id/1065/400/300" alt="Nature 6">
      <figcaption>Desert Road</figcaption>
    </figure>
  </div>

</body>
</html>
