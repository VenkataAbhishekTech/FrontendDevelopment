<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h2 style="text-align: center;">Student Registration Form</h2>
    <form style="width: 500px; margin: auto; background-color: #dcc4ba; padding: 20px; border-radius: 8px;">

        <!-- Roll Number -->
        <label for="roll">Roll No.:</label>
        <input type="text" id="roll" name="roll" placeholder="Enter Roll No" required><br><br>

        <!-- Student Name -->
        <label for="name">Student Name:</label>
        <input type="text" id="fname" name="fname" placeholder="First Name" required>
        <input type="text" id="lname" name="lname" placeholder="Last Name" required><br><br>

        <!-- Father's Name -->
        <label for="father">Father's Name:</label>
        <input type="text" id="father" name="father" placeholder="Enter Father's Name" required><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <!-- Mobile Number -->
        <label for="mobile">Mobile No.:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="123-456-7890" required><br><br>

        <!-- Email -->
        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <!-- Department -->
        <label>Department:</label>
        <input type="checkbox" id="cse" name="dept" value="CSE">
        <label for="cse">CSE</label>
        <input type="checkbox" id="it" name="dept" value="IT">
        <label for="it">IT</label>
        <input type="checkbox" id="ece" name="dept" value="ECE">
        <label for="ece">ECE</label>
        <input type="checkbox" id="civil" name="dept" value="CIVIL">
        <label for="civil">Civil</label>
        <input type="checkbox" id="mech" name="dept" value="MECH">
        <label for="mech">Mech</label><br><br>

        <!-- Course -->
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="diploma">Diploma</option>
            <option value="mba">MBA</option>
        </select><br><br>

        <!-- Student Photo -->
        <label for="photo">Student Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

        <!-- City -->
        <label for="city">City:</label>
        <input type="text" id="city" name="city" placeholder="Enter City Name"><br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="3" cols="40" placeholder="Enter Address"></textarea><br><br>

        <!-- Submit and Reset Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
