<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>Event Counter</title>
</head>
<body>
  <div class="box">
    <h2>Event-Based Counter</h2>

  </div>

  <script src="script.js"></script>
</body>
