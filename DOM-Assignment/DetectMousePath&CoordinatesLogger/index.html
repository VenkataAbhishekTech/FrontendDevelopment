<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mouse Path & Coordinates Logger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Mouse Path & Coordinates Logger</h1>

    <div id="box" class="tracking-box" tabindex="0">
      <!-- Dots will be appended here -->
    </div>

    <div class="info-panel">
      <div class="live-coords">
        <strong>Live Coordinates</strong>
        <div>clientX: <span id="clientX">-</span></div>
        <div>clientY: <span id="clientY">-</span></div>
        <div>relativeX: <span id="relativeX">-</span></div>
        <div>relativeY: <span id="relativeY">-</span></div>
      </div>

      <div class="path-log">
        <strong>Path Log (last 20)</strong>
        <ol id="coordsLog"></ol>
      </div>
    </div>

    <div class="controls">
      <button id="clearDotsBtn">Clear Dots</button>
      <button id="clearLogBtn">Clear Log</button>
    </div>

    <p class="hint">Move inside the box to see coordinates. Double-click inside to drop a red dot.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
